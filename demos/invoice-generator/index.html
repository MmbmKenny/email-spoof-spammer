<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt Generator (DEMO)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0a0d12;--ink:#e9eef5;--muted:#95a3b5;--faint:#68758a;--blue:#4d8bf5;--cyan:#39c6d6;
  --glass:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.12);--r:14px;
  --display:"Fraunces",Georgia,serif;--body:"Manrope",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
a{color:inherit}
.demoflag{text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;padding:7px;color:#061018;
  background:linear-gradient(90deg,var(--blue),var(--cyan));padding-top:calc(7px + env(safe-area-inset-top,0px))}
.head{text-align:center;padding:26px 20px 8px}
.head .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.head h1{font-family:var(--display);font-size:clamp(26px,6vw,40px);margin:8px 0 4px}
.head p{color:var(--muted);margin:0;font-size:14px}
.app{max-width:940px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.panel{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:20px}
.panel h2{font-family:var(--body);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:0 0 14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--stroke);border-radius:10px;font:inherit;background:rgba(255,255,255,.03);color:var(--ink)}
.line{display:grid;grid-template-columns:1fr 54px 88px 30px;gap:6px;margin-bottom:6px}
.line input{padding:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);padding:9px 12px}
.addbtn{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#061018;border:0;font-weight:700}
.print{width:100%;margin-top:14px;background:#20a76a;color:#04140b;border:0;font-weight:800;padding:13px}
/* receipt paper */
#paper{background:#fdfdfb;color:#14181f;border-radius:14px;padding:22px;font-family:var(--mono);box-shadow:0 30px 60px -25px rgba(0,0,0,.7)}
.rc-head{text-align:center;border-bottom:2px dashed #c7c7c7;padding-bottom:12px;margin-bottom:12px}
.rc-logo{width:42px;height:42px;border-radius:10px;margin:0 auto 8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:22px;font-weight:600}
.rc-head .biz{font-size:18px;font-weight:700;font-family:var(--body)}
.rc-head .sub{font-size:12px;color:#666}
.rc-row{display:flex;justify-content:space-between;font-size:13px;margin:3px 0}
.rc-items{border-top:1px dashed #c7c7c7;border-bottom:1px dashed #c7c7c7;padding:9px 0;margin:9px 0}
.rc-total{font-size:16px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--body)}
.paid{background:#d5f5e3;color:#1e7d4d}.unpaid{background:#fde2e2;color:#c0392b}.part{background:#fdf0d5;color:#a97a12}
.rc-foot{text-align:center;margin-top:12px;font-size:11px;color:#777}
footer{text-align:center;padding:22px;color:var(--faint);font-size:13px}
footer b{color:var(--cyan)}
@media print{body{background:#fff}.demoflag,.head,.editor,footer{display:none!important}
 .app{display:block;padding:0}#paperPanel{border:0;background:#fff;padding:0}#paper{box-shadow:none}}
</style>
</head>
<body>
<div class="demoflag">✦ DEMO TOOL — sample business, built to show what Brightfront delivers</div>
<div class="head">
  <div class="eyebrow">Receipt &amp; Invoice</div>
  <h1>Branded receipts in seconds</h1>
  <p>Edit on the left · print or save as PDF on the right</p>
</div>

<div class="app">
  <div class="panel editor">
    <h2>Details</h2>
    <label>Business name</label><input id="biz" value="Glow Hair Studio">
    <label>Business contact</label><input id="bizc" value="WhatsApp 0000 000 0000 · Lagos">
    <div class="two"><div><label>Customer</label><input id="cust" value="Ada Obi"></div><div><label>Receipt #</label><input id="rno" value="0001"></div></div>
    <h2 style="margin-top:18px">Items / services</h2>
    <div id="lines"></div>
    <button class="addbtn" id="add">+ Add line</button>
    <div class="two"><div><label>Discount (₦)</label><input id="disc" type="number" value="0"></div><div><label>Tax %</label><input id="tax" type="number" value="0"></div></div>
    <label>Payment status</label>
    <select id="status"><option>PAID</option><option>UNPAID</option><option>PART-PAYMENT</option></select>
    <button class="print" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>

  <div class="panel" id="paperPanel"><div id="paper"></div></div>
</div>

<footer>DEMO tool by Brightfront — <a href="../index.html" style="color:var(--cyan)">see more work</a></footer>

<script>
var linesEl=document.getElementById('lines');
function addLine(desc,qty,price){var d=document.createElement('div');d.className='line';
 d.innerHTML='<input placeholder="Item/service" value="'+(desc||'')+'"><input type="number" min="0" value="'+(qty||1)+'"><input type="number" min="0" value="'+(price||0)+'"><button title="remove">×</button>';
 d.querySelector('button').onclick=function(){d.remove();render()};
 d.querySelectorAll('input').forEach(function(i){i.addEventListener('input',render)});
 linesEl.appendChild(d);render();}
document.getElementById('add').onclick=function(){addLine('',1,0)};
['biz','bizc','cust','rno','disc','tax','status'].forEach(function(id){document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render)});
function fmt(n){return '₦'+Math.round(n).toLocaleString()}
function render(){
 var rows=[].map.call(linesEl.children,function(l){var i=l.querySelectorAll('input');return {d:i[0].value,q:+i[1].value||0,p:+i[2].value||0}});
 var sub=rows.reduce(function(s,r){return s+r.q*r.p},0);
 var disc=+document.getElementById('disc').value||0,taxp=+document.getElementById('tax').value||0;
 var taxed=(sub-disc)*taxp/100,total=sub-disc+taxed;
 var status=document.getElementById('status').value,cls=status==='UNPAID'?'unpaid':(status==='PART-PAYMENT'?'part':'paid');
 var now=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
 var biz=document.getElementById('biz').value||'Your Business';
 document.getElementById('paper').innerHTML=
  '<div class="rc-head"><div class="rc-logo">'+(biz.trim()[0]||'B')+'</div><div class="biz">'+biz+'</div><div class="sub">'+document.getElementById('bizc').value+'</div></div>'
  +'<div class="rc-row"><span>Receipt #'+document.getElementById('rno').value+'</span><span>'+now+'</span></div>'
  +'<div class="rc-row"><span>Customer</span><span>'+(document.getElementById('cust').value||'-')+'</span></div>'
  +'<div class="rc-items">'+(rows.filter(function(r){return r.d}).map(function(r){return '<div class="rc-row"><span>'+r.q+' × '+r.d+'</span><span>'+fmt(r.q*r.p)+'</span></div>'}).join('')||'<div class="rc-row"><span>No items</span><span></span></div>')+'</div>'
  +'<div class="rc-row"><span>Subtotal</span><span>'+fmt(sub)+'</span></div>'
  +(disc?'<div class="rc-row"><span>Discount</span><span>-'+fmt(disc)+'</span></div>':'')
  +(taxp?'<div class="rc-row"><span>Tax ('+taxp+'%)</span><span>'+fmt(taxed)+'</span></div>':'')
  +'<div class="rc-row rc-total"><span>TOTAL</span><span>'+fmt(total)+'</span></div>'
  +'<div class="rc-row" style="margin-top:8px"><span>Status</span><span class="badge '+cls+'">'+status+'</span></div>'
  +'<div class="rc-foot">Thank you for your patronage 💙<br>Powered by a simple digital receipt system</div>';
}
addLine('Haircut & styling',1,5000);addLine('Deep conditioning',1,3500);
</script>
</body>
</html>
